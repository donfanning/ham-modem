# Container-only ALSA config for ardopcf: no sound hardware. Capture reads raw S16_LE mono 12 kHz samples from a FIFO
# that relay.py fills in real time. Playback goes to a null PCM; alsa_tap.c (LD_PRELOAD) copies the samples into
# another FIFO that relay.py paces out in real time.
pcm.ardopin {
    type file
    slave.pcm "null"
    file "/dev/null"
    infile "/tmp/ardop_rx.fifo"
    format "raw"
}
pcm.ardopout {
    type null
}
