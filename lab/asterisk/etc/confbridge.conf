; A ConfBridge room behaves like a simplex frequency: everyone hears the sum of everyone else.
; Every audio "improvement" that clips or reshapes a modem preamble is switched off.
[general]

[ham_bridge]
type = bridge
internal_sample_rate = 8000
mixing_interval = 20
record_conference = no
video_mode = none
max_members = 50

[ham_bridge_wb]
type = bridge
internal_sample_rate = 16000
mixing_interval = 20
record_conference = no
video_mode = none
max_members = 50

[ham_user]
type = user
quiet = yes                       ; no join/leave sounds on the channel
announce_user_count = no
announce_user_count_all = no
announce_join_leave = no
announce_only_user = no
music_on_hold_when_empty = no
wait_marked = no
startmuted = no
dsp_drop_silence = no             ; silence detection would chop TXDELAY flags and frame tails
talk_detection_events = no
denoise = no
jitterbuffer = no                 ; the stations' own receive path copes with jitter
dtmf_passthrough = no
