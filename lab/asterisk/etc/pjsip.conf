; Lab trust model: anything from loopback is a station (no auth). Add digest auth before exposing this.
[transport-lab]
type = transport
protocol = udp
bind = 127.0.0.1:15060

[station]
type = endpoint
transport = transport-lab
context = ham
disallow = all
allow = ulaw,alaw,slin16
direct_media = no
rtp_symmetric = yes
force_rport = yes
dtmf_mode = rfc4733        ; never in-band: AFSK must not be mistaken for DTMF
send_rpid = no
rtp_timeout = 120

[station-identify]
type = identify
endpoint = station
match = 127.0.0.1
