; Lab trust model: anything on the lab network (the host is 172.31.73.1) is a station (no auth). Add digest auth before exposing this.
[transport-lab]
type = transport
protocol = udp
bind = 0.0.0.0:5060           ; inside the lab container only

[station]
type = endpoint
transport = transport-lab
context = ham
disallow = all
allow = ulaw,alaw,slin16,slin48:10   ; 10 ms framing keeps 48 kHz L16 packets under the MTU
direct_media = no
rtp_symmetric = yes
force_rport = yes
dtmf_mode = rfc4733        ; never in-band: AFSK must not be mistaken for DTMF
send_rpid = no
rtp_timeout = 120

[station-identify]
type = identify
endpoint = station
match = 172.31.73.0/24
