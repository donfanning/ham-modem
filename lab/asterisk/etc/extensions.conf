[general]
static = yes
writeprotect = yes

[ham]
; 7300: 1200/300 bd AFSK channel (narrowband mixing, G.711 legs)
exten => 7300,1,Answer()
 same => n,ConfBridge(ham-afsk,ham_bridge,ham_user)
 same => n,Hangup()

; 7316: wideband channel for 9600 bd G3RUH (16 kHz mixing; legs must use slin16/L16)
exten => 7316,1,Answer()
 same => n,ConfBridge(ham-wide,ham_bridge_wb,ham_user)
 same => n,Hangup()

; 7348: 48 kHz channel for 19200/38400 bd G3RUH (legs must use slin48/L16 at 48 kHz, 10 ms packets)
exten => 7348,1,Answer()
 same => n,ConfBridge(ham-48k,ham_bridge_48k,ham_user)
 same => n,Hangup()

; 7399: echo -- a single station hears its own packets (loopback sanity check)
exten => 7399,1,Answer()
 same => n,Echo()
