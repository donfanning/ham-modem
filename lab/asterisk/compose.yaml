# Ham-Modem Asterisk lab: ConfBridge rooms as shared packet channels.
#
# Isolation from El-Modem's lab (which also lives in a directory called "asterisk"):
#   * explicit project name -- without it Compose derives "asterisk" from the directory and would treat
#     El-Modem's containers as ours (this happened once and replaced El-Modem's PBX);
#   * own bridge network with a fixed subnet, no host networking, no published host ports. Stations on this
#     host reach the PBX at 172.31.73.10:5060 directly; nothing binds on the host.
#
#   docker compose up -d
#   ham-modem --sip-dial 7300@172.31.73.10 --kiss-tcp 8001 -m
name: ham-modem-lab

services:
  pbx:
    image: andrius/asterisk:22.10.1_debian-trixie
    container_name: ham-modem-lab-pbx
    restart: unless-stopped
    volumes:
      - ./etc:/etc/asterisk:ro
    networks:
      ham-lab:
        ipv4_address: 172.31.73.10
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  ham-lab:
    name: ham-modem-lab
    ipam:
      config:
        - subnet: 172.31.73.0/24
