# Ham-Modem Asterisk lab: ConfBridge rooms as shared packet channels.
# Host networking on loopback (SIP 127.0.0.1:15060, RTP 20000-20100) so ham-modem instances run straight from
# the checkout. Does not touch El-Modem's lab PBX (192.0.2.21:5060).
#   docker compose up -d
#   ham-modem --sip-dial 7300@127.0.0.1:15060 --kiss-tcp 8001 -m
services:
  asterisk:
    image: andrius/asterisk:22.10.1_debian-trixie
    container_name: ham-modem-pbx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./etc:/etc/asterisk:ro
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
