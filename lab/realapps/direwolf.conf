# Direwolf 1.7 as an on-air peer on the ham-modem audio hub (runs in a container on the lab network).
# Audio in: raw s16le from relay.py on UDP 7355; audio out: ALSA "hubout" -> FIFO -> relay.py -> hub (asound.conf).
ADEVICE udp:7355 hubout
ARATE 8000
ACHANNELS 1
CHANNEL 0
MYCALL DW1TST
MODEM 1200
TXDELAY 30
# WIDEn-N digipeater (traces itself into the path) and a custom beacon.
DIGIPEAT 0 0 ^WIDE[3-7]-[1-7]$|^TEST$ ^WIDE[12]-[12]$ TRACE
CBEACON delay=0:20 every=5:00 info=">Direwolf peer on the VoIP channel"
KISSPORT 0
AGWPORT 0
